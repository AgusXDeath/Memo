<div>
    <h2>Bandeja de Salida</h2>
   
    <table mat-table [dataSource]="mensajes" class="mat-elevation-z8 inbox-table">
      
      <!-- Receptor -->
      <ng-container matColumnDef="receptor">
        <th mat-header-cell *matHeaderCellDef> Para: </th>
        <td mat-cell *matCellDef="let mensaje"> {{ mensaje.receptor }} </td>
      </ng-container>
  
      <!-- Mensaje -->
      <ng-container matColumnDef="mensaje">
        <th mat-header-cell *matHeaderCellDef> Mensaje </th>
        <td mat-cell *matCellDef="let mensaje"> {{ mensaje.mensaje }} </td>
      </ng-container>
  
      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let mensaje">
            <button mat-button (click)="deleteMensaje(mensaje)">Eliminar</button>
        </td>
      </ng-container>
      
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
