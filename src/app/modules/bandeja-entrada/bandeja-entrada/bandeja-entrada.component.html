<div>
    <h2>Bandeja de Entrada</h2>
   
    <table mat-table [dataSource]="mensajes" class="mat-elevation-z8 inbox-table">
      
      <!-- Emisor -->
      <ng-container matColumnDef="emisor">
        <th mat-header-cell *matHeaderCellDef> Emisor </th>
        <td mat-cell *matCellDef="let mensaje"> {{ mensaje.emisor }} </td>
      </ng-container>
      
      <!-- Receptor -->
      <ng-container matColumnDef="receptor">
        <th mat-header-cell *matHeaderCellDef> Para: </th>
        <td mat-cell *matCellDef="let mensaje"> {{ mensaje.receptor }} </td>
      </ng-container>
  
      <!-- Estado (Leído/No Leído) -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let mensaje">
          <span *ngIf="mensaje.leido; else unread">Leído</span>
          <ng-template #unread><strong>No leído</strong></ng-template>
        </td>
      </ng-container>
  
      <!-- Mensaje -->
      <ng-container matColumnDef="mensaje">
        <th mat-header-cell *matHeaderCellDef> Mensaje </th>
        <td mat-cell *matCellDef="let mensaje" [class.unread]="!mensaje.leido"> {{ mensaje.mensaje }} </td>
      </ng-container>
  
      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let mensaje">
          <button mat-button (click)="toggleLeido(mensaje)">
            {{ mensaje.leido ? 'Marcar como No leído' : 'Marcar como Leído' }}
          </button>
          <button mat-button (click)="deleteMensaje(mensaje)">Eliminar</button>
        </td>
      </ng-container>
      
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
