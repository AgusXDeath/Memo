<div>
  <h2>Papelera</h2>
  <table mat-table [dataSource]="mensajes" class="mat-elevation-z8 trash-table">
    
    <!-- Definición de la columna "Emisor" -->
    <ng-container matColumnDef="emisor">
      <th mat-header-cell *matHeaderCellDef> Emisor </th>
      <td mat-cell *matCellDef="let mensaje"> {{ mensaje.emisor }} </td>
    </ng-container>
    
    <!-- Definición de la columna "Receptor" -->
    <ng-container matColumnDef="receptor">
      <th mat-header-cell *matHeaderCellDef> Para: </th>
      <td mat-cell *matCellDef="let mensaje"> {{ mensaje.receptor }} </td>
    </ng-container>
    
    <!-- Definición de la columna "Mensaje" -->
    <ng-container matColumnDef="mensaje">
      <th mat-header-cell *matHeaderCellDef> Mensaje </th>
      <td mat-cell *matCellDef="let mensaje"> {{ mensaje.mensaje }} </td>
    </ng-container>
    
    <!-- Definición de la columna "Acciones" -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let mensaje">
        <button mat-button (click)="deleteMensaje(mensaje.id)">Eliminar definitivamente</button>
      </td>
    </ng-container>
    
    <!-- Fila de cabecera -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <!-- Fila de datos -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
